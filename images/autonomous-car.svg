<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Top view of an autonomous Arduino car with its sensors labelled" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1d"/><stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#4fc3ff" stop-opacity=".18"/><stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- road -->
  <rect x="215" y="0" width="210" height="360" fill="#262626"/>
  <line x1="215" y1="0" x2="215" y2="360" stroke="#4a4a4a" stroke-width="3"/>
  <line x1="425" y1="0" x2="425" y2="360" stroke="#4a4a4a" stroke-width="3"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#f5c542" stroke-width="3" stroke-dasharray="22 16" opacity=".7"/>

  <!-- ultrasonic waves -->
  <g fill="none" stroke="#4fc3ff" stroke-width="3" stroke-linecap="round">
    <path d="M292 66 Q320 44 348 66" opacity=".9"/>
    <path d="M280 54 Q320 20 360 54" opacity=".55"/>
    <path d="M268 42 Q320 -4 372 42" opacity=".3"/>
  </g>

  <!-- wheels -->
  <g fill="#111" stroke="#5a5a5a" stroke-width="2">
    <rect x="256" y="118" width="16" height="42" rx="4"/><rect x="368" y="118" width="16" height="42" rx="4"/>
    <rect x="256" y="216" width="16" height="42" rx="4"/><rect x="368" y="216" width="16" height="42" rx="4"/>
  </g>

  <!-- chassis -->
  <rect x="270" y="104" width="100" height="168" rx="14" fill="#2f3b4a" stroke="#53657c" stroke-width="2"/>

  <!-- ultrasonic sensor -->
  <rect x="282" y="76" width="76" height="26" rx="4" fill="#1d6fd1" stroke="#5aa2f0"/>
  <g fill="#c9ced6" stroke="#8a93a0" stroke-width="1.5">
    <circle cx="302" cy="89" r="9"/><circle cx="338" cy="89" r="9"/>
  </g>
  <circle cx="302" cy="89" r="4" fill="#333"/><circle cx="338" cy="89" r="4" fill="#333"/>

  <!-- IR sensors -->
  <circle cx="284" cy="112" r="10" fill="#ff4d4d" opacity=".25"/><circle cx="284" cy="112" r="5" fill="#e03a3a"/>
  <circle cx="356" cy="112" r="10" fill="#ff4d4d" opacity=".25"/><circle cx="356" cy="112" r="5" fill="#e03a3a"/>

  <!-- ESP32-CAM -->
  <rect x="300" y="116" width="40" height="36" rx="3" fill="#1a1a1a" stroke="#8a8a8a"/>
  <circle cx="320" cy="128" r="9" fill="#0b0b0b" stroke="#6a6a6a" stroke-width="2"/>
  <circle cx="320" cy="128" r="3.5" fill="#3b7bd8"/>

  <!-- Arduino -->
  <rect x="284" y="162" width="72" height="56" rx="4" fill="#0e7c86" stroke="#35b3bd"/>
  <rect x="276" y="172" width="14" height="18" rx="2" fill="#bdbdbd"/>
  <rect x="318" y="180" width="24" height="16" rx="2" fill="#111"/>
  <g fill="#111"><rect x="290" y="165" width="60" height="4"/><rect x="290" y="211" width="60" height="4"/></g>

  <!-- motor driver -->
  <rect x="296" y="230" width="48" height="30" rx="3" fill="#b3261e" stroke="#e5574f"/>
  <rect x="307" y="236" width="18" height="14" rx="2" fill="#222"/>

  <!-- labels -->
  <g stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="358" y1="89" x2="446" y2="89"/><line x1="340" y1="130" x2="446" y2="130"/>
    <line x1="356" y1="190" x2="446" y2="190"/><line x1="344" y1="245" x2="446" y2="245"/>
    <line x1="274" y1="112" x2="194" y2="112"/>
  </g>
  <g fill="#e8e8e8"><circle cx="446" cy="89" r="3"/><circle cx="446" cy="130" r="3"/><circle cx="446" cy="190" r="3"/><circle cx="446" cy="245" r="3"/><circle cx="194" cy="112" r="3"/></g>
  <g font-family="Poppins, Arial, sans-serif" font-size="13" fill="#e8e8e8">
    <text x="456" y="94">Ultrasonic sensor</text>
    <text x="456" y="135">ESP32-CAM</text>
    <text x="456" y="195">Arduino</text>
    <text x="456" y="250">Motor driver</text>
    <text x="184" y="117" text-anchor="end">IR sensor</text>
  </g>
</svg>
