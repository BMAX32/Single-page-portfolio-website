<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Code editor window showing HTML, CSS and JavaScript" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1608"/><stop offset=".55" stop-color="#14141f"/><stop offset="1" stop-color="#0b1a50"/>
    </linearGradient>
    <clipPath id="win"><rect x="60" y="34" width="520" height="292" rx="12"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <rect x="60" y="34" width="520" height="292" rx="12" fill="#1e1e1e" stroke="#3a3a3a"/>
  <g clip-path="url(#win)">
    <rect x="60" y="34" width="520" height="34" fill="#2a2a2a"/>
    <rect x="60" y="68" width="520" height="258" fill="#1e1e1e"/>
    <rect x="60" y="68" width="40" height="258" fill="#191919"/>
  </g>
  <circle cx="82" cy="51" r="5.5" fill="#ff5f56"/><circle cx="102" cy="51" r="5.5" fill="#ffbd2e"/><circle cx="122" cy="51" r="5.5" fill="#27c93f"/>
  <text x="150" y="55" font-family="Consolas, Menlo, monospace" font-size="12" fill="#a8a8a8">index.html</text>

  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13">
    <g fill="#555" text-anchor="end">
      <text x="90" y="94">1</text><text x="90" y="114">2</text><text x="90" y="134">3</text><text x="90" y="154">4</text>
      <text x="90" y="174">5</text><text x="90" y="194">6</text><text x="90" y="214">7</text><text x="90" y="234">8</text>
      <text x="90" y="254">9</text><text x="90" y="274">10</text><text x="90" y="294">11</text><text x="90" y="314">12</text>
    </g>
    <text x="112" y="94"><tspan fill="#808080">&lt;</tspan><tspan fill="#f07178">section</tspan> <tspan fill="#ffcb6b">class</tspan><tspan fill="#808080">=</tspan><tspan fill="#c3e88d">"hero"</tspan><tspan fill="#808080">&gt;</tspan></text>
    <text x="130" y="114"><tspan fill="#808080">&lt;</tspan><tspan fill="#f07178">h1</tspan><tspan fill="#808080">&gt;</tspan><tspan fill="#eeeeee">Hello, World!</tspan><tspan fill="#808080">&lt;/</tspan><tspan fill="#f07178">h1</tspan><tspan fill="#808080">&gt;</tspan></text>
    <text x="112" y="134"><tspan fill="#808080">&lt;/</tspan><tspan fill="#f07178">section</tspan><tspan fill="#808080">&gt;</tspan></text>

    <text x="112" y="174"><tspan fill="#ffcb6b">.hero</tspan> <tspan fill="#808080">{</tspan></text>
    <text x="130" y="194"><tspan fill="#82aaff">display</tspan><tspan fill="#808080">:</tspan> <tspan fill="#c3e88d">flex</tspan><tspan fill="#808080">;</tspan></text>
    <text x="130" y="214"><tspan fill="#82aaff">color</tspan><tspan fill="#808080">:</tspan> <tspan fill="#c3e88d">#ffffff</tspan><tspan fill="#808080">;</tspan></text>
    <text x="112" y="234"><tspan fill="#808080">}</tspan></text>

    <text x="112" y="274"><tspan fill="#c792ea">const</tspan> <tspan fill="#eeeeee">hi</tspan> <tspan fill="#808080">=</tspan> <tspan fill="#808080">()</tspan> <tspan fill="#c792ea">=&gt;</tspan> <tspan fill="#808080">{</tspan></text>
    <text x="130" y="294"><tspan fill="#eeeeee">console</tspan><tspan fill="#808080">.</tspan><tspan fill="#82aaff">log</tspan><tspan fill="#808080">(</tspan><tspan fill="#c3e88d">"Hi!"</tspan><tspan fill="#808080">);</tspan></text>
    <text x="112" y="314"><tspan fill="#808080">}</tspan></text>
  </g>
</svg>
